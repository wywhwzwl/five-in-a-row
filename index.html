<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五子棋 · Five-in-a-Row</title>
  <style>
    /* ===== 全局重置 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #2c1810 0%, #4a2c1a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #f4e4bc;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      letter-spacing: 4px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    /* ===== 主布局：棋盘 + 棋谱面板 ===== */
    .main-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .board-wrapper {
      position: relative;
      border-radius: 8px;
      box-shadow:
        0 0 0 4px #3a2418,
        0 0 0 8px #8b6f47,
        0 20px 50px rgba(0,0,0,0.6);
      background: #dcb35c;
    }

    canvas {
      display: block;
      cursor: pointer;
      border-radius: 4px;
    }

    /* ===== 棋谱面板 ===== */
    .history-panel {
      width: 240px;
      max-height: var(--board-size, 620px);
      background: rgba(0,0,0,0.35);
      border: 2px solid #8b6f47;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .history-header {
      padding: 12px 16px;
      background: rgba(139, 111, 71, 0.4);
      border-bottom: 1px solid #8b6f47;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-header h3 {
      font-size: 14px;
      letter-spacing: 2px;
    }

    .history-count {
      font-size: 12px;
      color: #d4b87a;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .history-list::-webkit-scrollbar {
      width: 6px;
    }
    .history-list::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    .history-list::-webkit-scrollbar-thumb {
      background: #8b6f47;
      border-radius: 3px;
    }

    .history-item {
      padding: 6px 16px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    .history-item:hover {
      background: rgba(139, 111, 71, 0.2);
    }
    .history-item .move-num {
      color: #d4b87a;
      font-weight: bold;
      min-width: 32px;
    }
    .history-item .move-player {
      min-width: 20px;
      font-size: 16px;
      text-align: center;
    }
    .history-item .move-pos {
      font-family: 'Consolas', monospace;
      color: #f4e4bc;
      flex: 1;
      text-align: right;
    }
    .history-item.player-black .move-player { color: #222; }
    .history-item.player-black .move-player::before {
      content: '●';
      color: #000;
      text-shadow: 0 0 2px rgba(255,255,255,0.4);
    }
    .history-item.player-white .move-player::before {
      content: '○';
      color: #fff;
      text-shadow: 0 0 2px rgba(0,0,0,0.6);
    }

    .history-empty {
      padding: 40px 16px;
      text-align: center;
      color: #8b6f47;
      font-size: 13px;
    }

    .history-footer {
      padding: 8px 16px;
      border-top: 1px solid #8b6f47;
      font-size: 11px;
      color: #d4b87a;
      text-align: center;
    }

    /* ===== 控制栏 ===== */
    .control-bar {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      background: #8b6f47;
      color: #f4e4bc;
      border: 2px solid #3a2418;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    button:hover:not(:disabled) {
      background: #a08560;
      transform: translateY(-1px);
    }
    button:active:not(:disabled) {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button.primary {
      background: #c0392b;
    }
    button.primary:hover:not(:disabled) {
      background: #d35446;
    }

    select {
      padding: 10px 14px;
      font-size: 14px;
      background: #8b6f47;
      color: #f4e4bc;
      border: 2px solid #3a2418;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    select:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status {
      padding: 10px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid #8b6f47;
      border-radius: 4px;
      min-width: 200px;
      text-align: center;
      font-size: 14px;
    }

    /* ===== 阶段提示 ===== */
    .stage-badge {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(39, 174, 96, 0.9);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    /* ===== 键盘快捷键提示 ===== */
    .kbd-hint {
      margin-top: 12px;
      font-size: 11px;
      color: #8b6f47;
      text-align: center;
    }
    .kbd {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(0,0,0,0.3);
      border: 1px solid #8b6f47;
      border-radius: 3px;
      font-family: 'Consolas', monospace;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div class="stage-badge">阶段 4 · 状态管理</div>
  <h1>五子棋 · GOMOKU</h1>

  <div class="main-layout">
    <div class="board-wrapper">
      <canvas id="board"></canvas>
    </div>

    <!-- 棋谱面板：复盘 / 历史记录 -->
    <div class="history-panel">
      <div class="history-header">
        <h3>📜 棋谱</h3>
        <span class="history-count" id="history-count">0 手</span>
      </div>
      <div class="history-list" id="history-list">
        <div class="history-empty">尚无落子</div>
      </div>
      <div class="history-footer">
        快捷键: <span class="kbd">Ctrl</span>+<span class="kbd">Z</span> 悔棋
        <span class="kbd">Ctrl</span>+<span class="kbd">R</span> 重开
      </div>
    </div>
  </div>

  <div class="control-bar">
    <div class="status" id="status">● 黑棋（玩家）执子</div>
    <button id="btn-undo" disabled title="Ctrl+Z">↶ 悔棋</button>
    <button id="btn-reset" class="primary" title="Ctrl+R">🔄 重新开始</button>
    <button id="btn-clear" title="清空棋谱">🗑️ 清空棋谱</button>
    <select id="ai-level">
      <option value="1">AI: V1.0 随机</option>
      <option value="2">AI: V2.0 防御</option>
      <option value="3" selected>AI: V3.0 评分</option>
    </select>
  </div>

  <!-- 模块加载顺序：配置 → 渲染 → 引擎 → AI -->
  <script src="config.js"></script>
  <script src="renderer.js"></script>
  <script src="gameEngine.js"></script>
  <script src="aiPlayer.js"></script>
  <script>
    // ===== 阶段 4 启动脚本 =====
    (function bootstrap() {
      const canvas = document.getElementById('board');
      const statusEl = document.getElementById('status');
      const historyList = document.getElementById('history-list');
      const historyCount = document.getElementById('history-count');
      const btnUndo = document.getElementById('btn-undo');
      const btnReset = document.getElementById('btn-reset');
      const btnClear = document.getElementById('btn-clear');
      const aiSelect = document.getElementById('ai-level');

      let aiThinking = false;
      let aiVersion = 3;
      let replayLog = [];   // 复盘日志（协议要求：重置时不清除）

      Renderer.init(canvas, CONFIG);
      Engine.init(CONFIG);
      AIPlayer.init(CONFIG);

      // 从 CONFIG 注入 CSS 变量（避免硬编码 620）
      document.documentElement.style.setProperty('--board-size', CONFIG.CANVAS_SIZE + 'px');

      // ---- 棋谱渲染 ----
      const renderHistory = () => {
        historyCount.textContent = `${replayLog.length} 手`;
        if (replayLog.length === 0) {
          historyList.innerHTML = '<div class="history-empty">尚无落子</div>';
          return;
        }
        historyList.innerHTML = replayLog.map((m, i) => {
          const playerClass = m.player === 1 ? 'player-black' : 'player-white';
          const playerMark = m.player === 1 ? '●' : '○';
          return `
            <div class="history-item ${playerClass}">
              <span class="move-num">${i + 1}</span>
              <span class="move-player">${playerMark}</span>
              <span class="move-pos">(${m.row + 1}, ${m.col + 1})</span>
            </div>
          `;
        }).join('');
        // 滚动到底部
        historyList.scrollTop = historyList.scrollHeight;
      };

      // ---- 引擎状态订阅 ----
      Engine.subscribe((s) => {
        Renderer.render(s.board, {
          lastMove: s.history.length > 0
            ? s.history[s.history.length - 1].move
            : null,
          winLine: s.winningLine,
        });

        // 状态栏文案
        if (s.gameOver) {
          if (s.winner === 0) statusEl.textContent = '🤝 平局';
          else if (s.winner === 1) statusEl.textContent = '🎉 黑棋（玩家）胜利！';
          else statusEl.textContent = '🤖 白棋（AI）胜利！';
        } else if (s.forbiddenPoint) {
          statusEl.textContent = `⚠️ 禁手点 (${s.forbiddenPoint.row + 1}, ${s.forbiddenPoint.col + 1})`;
        } else if (aiThinking) {
          statusEl.textContent = `🤖 AI 思考中 (V${aiVersion}.0)…`;
        } else {
          statusEl.textContent = s.currentPlayer === 1
            ? '● 黑棋（玩家）执子'
            : '○ 白棋（AI）执子';
        }

        // 控制按钮启用
        btnUndo.disabled = s.history.length === 0 || aiThinking || s.gameOver;
        btnReset.disabled = aiThinking;
        btnClear.disabled = replayLog.length === 0;
        aiSelect.disabled = aiThinking;

        // 同步棋谱（仅展示对局过程中的 history）
        renderHistory();

        // 玩家落子后 → 触发 AI 思考
        if (!s.gameOver && s.currentPlayer === 2 && !aiThinking) {
          triggerAI(s);
        }
      });

      // ---- AI 思考入口 ----
      async function triggerAI(state) {
        aiThinking = true;
        statusEl.textContent = `🤖 AI 思考中 (V${aiVersion}.0)…`;

        try {
          const move = await AIPlayer.decideMove(state.board, 2, aiVersion);
          if (move) {
            Engine.applyAIMove(move.row, move.col);
          }
        } catch (e) {
          console.error('AI 决策异常:', e);
          statusEl.textContent = '❌ AI 决策异常，请重新开始';
        } finally {
          aiThinking = false;
        }
      }

      // ---- 棋谱追加监听（重写 placePiece 后回调） ----
      const originalApplyAIMove = Engine.applyAIMove;
      Engine.applyAIMove = function(row, col) {
        const result = originalApplyAIMove.call(Engine, row, col);
        if (result && result.ok) replayLog.push({ row, col, player: 2 });
        return result;
      };
      const originalHandlePlayerMove = Engine.handlePlayerMove;
      Engine.handlePlayerMove = function(row, col) {
        const result = originalHandlePlayerMove.call(Engine, row, col);
        if (result && result.ok) replayLog.push({ row, col, player: 1 });
        return result;
      };

      // ---- 棋盘点击 ----
      Renderer.onCellClick((row, col) => {
        if (aiThinking) {
          statusEl.textContent = '⏳ 请等待 AI 完成落子';
          return;
        }
        const result = Engine.handlePlayerMove(row, col);
        if (!result.ok && result.reason !== 'forbidden') {
          if (result.reason === 'occupied') statusEl.textContent = '该位置已有棋子';
          else if (result.reason === 'not-your-turn') statusEl.textContent = '当前不是你的回合';
          else if (result.reason === 'game-over') statusEl.textContent = '对局已结束，请重新开始';
        }
      });

      // ---- 控制按钮 ----
      btnReset.addEventListener('click', () => {
        if (aiThinking) return;
        if (replayLog.length > 0 && !confirm('重新开始当前对局？\n（棋谱将保留用于复盘）')) return;
        Engine.reset();
        statusEl.textContent = '● 黑棋（玩家）执子';
      });

      btnUndo.addEventListener('click', () => {
        if (aiThinking) return;
        const undone = Engine.undo();
        if (undone) {
          // 同步移除复盘日志中对应的最后两步
          replayLog.pop(); // AI
          replayLog.pop(); // 玩家
          statusEl.textContent = '↶ 已悔棋（玩家+AI 两步）';
        }
      });

      btnClear.addEventListener('click', () => {
        if (!confirm('确认清空棋谱？此操作不可撤销。')) return;
        replayLog = [];
        renderHistory();
        statusEl.textContent = '🗑️ 棋谱已清空';
      });

      aiSelect.addEventListener('change', (e) => {
        aiVersion = parseInt(e.target.value, 10);
        const labels = { 1: '随机', 2: '防御', 3: '评分' };
        statusEl.textContent = `⚙️ AI 难度: V${aiVersion}.0 (${labels[aiVersion]})`;
      });

      // ---- 键盘快捷键 ----
      document.addEventListener('keydown', (e) => {
        // Ctrl+Z → 悔棋
        if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !btnUndo.disabled) {
          e.preventDefault();
          btnUndo.click();
        }
        // Ctrl+R → 重开
        if ((e.ctrlKey || e.metaKey) && e.key === 'r' && !btnReset.disabled) {
          e.preventDefault();
          btnReset.click();
        }
        // 1/2/3 → AI 难度
        if (!aiSelect.disabled && ['1','2','3'].includes(e.key) && !e.ctrlKey && !e.metaKey) {
          aiSelect.value = e.key;
          aiSelect.dispatchEvent(new Event('change'));
        }
      });

      // ---- 初始化显示 ----
      renderHistory();
    })();
  </script>
</body>
</html>
